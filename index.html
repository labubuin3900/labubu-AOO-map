<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>전술 맵 제작기</title>
<style>
:root{--bg:#0c1420;--panel:#142235;--line:#30445d;--text:#edf4fb;--muted:#9fb0c4;--blue:#1677ed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif;overflow:hidden}
header{height:62px;background:#121d2c;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:8px 14px;gap:8px}
.logo{font-size:22px;font-weight:800;margin-right:auto}.sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
button{border:1px solid #40546e;background:#1c2c42;color:#fff;border-radius:7px;padding:9px 12px;cursor:pointer}
button:hover{background:#29405e}.primary{background:#15599f}.danger{background:#662832}
.layout{height:calc(100vh - 62px);display:grid;grid-template-columns:145px minmax(500px,1fr) 250px}
aside{background:#142235;overflow:auto}.left{border-right:1px solid var(--line);padding:9px}.right{border-left:1px solid var(--line);padding:10px}
.section{font-weight:800;margin:5px 0 10px}.tool{width:100%;text-align:left;margin-bottom:6px;padding:10px}.tool.active{background:#14558f;outline:2px solid #3ea0ff}
.canvas{background:#080e16;display:flex;align-items:center;justify-content:center;overflow:auto;padding:18px}
#stage{position:relative;width:min(1080px,calc(100vw - 445px));min-width:500px;aspect-ratio:1080/827;box-shadow:0 8px 40px #0009}
#map{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none}
#objects{position:absolute;inset:0}
.obj{position:absolute;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none}
.obj.dragging{cursor:grabbing}.selected{outline:2px solid #fff;outline-offset:3px}
.text{background:#111a28df;border:1px solid #ffffff66;border-radius:5px;padding:5px 9px;white-space:nowrap;text-shadow:0 2px 3px #000;font-weight:700}
.marker{display:flex;flex-direction:column;align-items:center;gap:4px}.dot{border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 9px #0008;font-size:13px;font-weight:900}
.dot.blue{background:#1677ed}.dot.red{background:#e53935}.dot.yellow{background:#e4ad18;color:#17120a}.dot.green{background:#1faa5b}.dot.white{background:#dce4ed;color:#111}
.marker .caption{background:#101923e8;border-radius:4px;padding:3px 6px;font-size:12px;white-space:nowrap;text-shadow:0 1px 2px #000}
.group{border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:10px}
label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}
input,select{width:100%;background:#0c1623;border:1px solid #40536c;color:#fff;border-radius:6px;padding:8px}
.row{display:flex;gap:6px}.row>*{flex:1}
.help{color:var(--muted);font-size:12px;line-height:1.55}
.status{position:absolute;left:10px;bottom:10px;background:#0d1725e8;padding:7px 10px;border-radius:6px;font-size:12px;color:#b8c8da}
</style>
</head>
<body>
<header>
<div class="logo">🗺️ 전술 맵 제작기 <span class="sub">맵 위에 텍스트와 표시를 추가하세요</span></div>
<button onclick="clearAll()">새로 만들기</button>
<button onclick="saveProject()">저장</button>
<button onclick="loadProject()">불러오기</button>
<button class="primary" onclick="exportImage()">PNG 내보내기</button>
</header>

<div class="layout">
<aside class="left">
<div class="section">도구</div>
<button class="tool active" data-tool="select">↖ 선택 / 이동</button>
<button class="tool" data-tool="text">T 텍스트</button>
<button class="tool" data-tool="blue">🔵 아군 표시</button>
<button class="tool" data-tool="red">🔴 적군 표시</button>
<button class="tool" data-tool="yellow">🟡 목표 표시</button>
<button class="tool" data-tool="green">🟢 지원 표시</button>
<button class="tool" data-tool="white">⚪ 중립 표시</button>
<div class="section" style="margin-top:16px">편집</div>
<button class="tool" id="undo">↶ 실행 취소</button>
<button class="tool" id="redo">↷ 다시 실행</button>
<button class="tool danger" id="delete">🗑 선택 삭제</button>
<div class="group help">
<b>사용법</b><br>
도구를 선택하고 맵을 클릭하세요.<br>
생성된 항목은 선택 도구로 드래그할 수 있습니다.<br>
오른쪽 설정에서 이름과 크기를 바꿀 수 있습니다.<br><br>
맵 사진 자체는 수정되지 않습니다.
</div>
</aside>

<div id="objects"></div>
<div class="status" id="status">선택 도구 · 항목 0개</div>
</div>
</main>

<aside class="right">
<div class="section">선택 항목</div>
<div class="group">
<label>이름 / 텍스트</label><textarea id="name" rows="5" placeholder="예: 아군 1팀&#10;정면 돌파" style="width:100%;resize:vertical;background:#0c1623;color:#fff;border:1px solid #40536c;border-radius:6px;padding:8px;font:inherit"></textarea>
<label>글자 크기</label><input id="fontSize" type="number" min="8" max="72" value="16">
<label>색상</label>
<div style="display:flex;gap:6px;align-items:center">
<input id="textColor" type="color" value="#ffffff" style="height:38px;padding:3px">
<button type="button" onclick="setTextColor('#ffffff')">흰색</button>
<button type="button" onclick="setTextColor('#ff3b30')">빨강</button>
<button type="button" onclick="setTextColor('#1677ed')">파랑</button>
<button type="button" onclick="setTextColor('#ffd60a')">노랑</button>
</div>
<label>표시 크기</label><input id="markerSize" type="range" min="14" max="70" value="32">
<label>투명도</label><input id="opacity" type="range" min="10" max="100" value="100">
<div class="row" style="margin-top:10px"><button id="front">앞으로</button><button id="back">뒤로</button></div>
</div>
<div class="section">맵</div>
<div class="group">
<button style="width:100%" onclick="document.getElementById('mapFile').click()">맵 이미지 바꾸기</button>
<input id="mapFile" type="file" accept="image/*" hidden>
<label>확대/축소</label><input id="zoom" type="range" min="50" max="180" value="100">
</div>
<div class="group help">
<b>저장 방식</b><br>
저장: 현재 배치 정보를 JSON으로 저장<br>
PNG: 맵과 모든 텍스트/표시를 하나의 이미지로 출력
</div>
</aside>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let tool="select", selected=null, items=[], undoStack=[], redoStack=[], drag=null, lastX=0,lastY=0;

const kindInfo={
 blue:{name:"아군",color:"#1677ed"},
 red:{name:"적군",color:"#e53935"},
 yellow:{name:"목표",color:"#e4ad18"},
 green:{name:"지원",color:"#1faa5b"},
 white:{name:"중립",color:"#dce4ed"}
};

function uid(){return Math.random().toString(36).slice(2,10)}
function point(e){
 const r=$("#stage").getBoundingClientRect();
 return {x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100};
}
function snapshot(){undoStack.push(JSON.stringify(items));if(undoStack.length>50)undoStack.shift();redoStack=[]}

function multilinePrompt(title, initial=""){
 return new Promise(resolve=>{
  const wrap=document.createElement("div");
  wrap.style.cssText="position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:9999";
  wrap.innerHTML=`<div style="width:420px;background:#142235;border:1px solid #40536c;border-radius:10px;padding:18px;box-shadow:0 12px 40px #0009">
    <div style="font-weight:800;margin-bottom:10px">${title}</div>
    <textarea id="multiText" rows="6" style="width:100%;resize:vertical;background:#0c1623;color:#fff;border:1px solid #40536c;border-radius:6px;padding:10px;font:inherit" placeholder="첫 번째 줄&#10;두 번째 줄&#10;세 번째 줄"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:7px;margin-top:10px">
      <button id="multiCancel">취소</button><button id="multiOk" style="background:#15599f">확인</button>
    </div>
  </div>`;
  document.body.appendChild(wrap);
  const ta=wrap.querySelector("#multiText");ta.value=initial;ta.focus();ta.select();
  const done=v=>{wrap.remove();resolve(v)};
  wrap.querySelector("#multiOk").onclick=()=>done(ta.value);
  wrap.querySelector("#multiCancel").onclick=()=>done(null);
  wrap.addEventListener("click",e=>{if(e.target===wrap)done(null)});
  ta.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();done(ta.value)}});
 });
}
function setTool(t){
 tool=t; $$(".tool[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));
 $("#status").textContent=(t==="select"?"선택 도구":t==="text"?"텍스트 추가":kindInfo[t]?.name+" 표시 추가")+" · 항목 "+items.length+"개";
}
$$(".tool[data-tool]").forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

$("#stage").addEventListener("click",async e=>{
 if(e.target.closest(".obj"))return;
 if(tool==="select")return;
 const p=point(e);
 if(tool==="text"){
   const text=await multilinePrompt("맵에 표시할 텍스트를 입력하세요","아군 1팀");
   if(!text?.trim())return;
   snapshot();items.push({id:uid(),type:"text",x:p.x,y:p.y,text:text.trim(),fontSize:16,color:"#ffffff",opacity:1,markerSize:32});selected=items.at(-1).id;render();
 }else if(kindInfo[tool]){
   const text=prompt("표시 이름을 입력하세요",kindInfo[tool].name);
   if(text===null)return;
   snapshot();items.push({id:uid(),type:"marker",kind:tool,x:p.x,y:p.y,text:text.trim()||kindInfo[tool].name,fontSize:14,color:"#ffffff",opacity:1,markerSize:32});selected=items.at(-1).id;render();
 }
});

$("#stage").addEventListener("pointerdown",e=>{
 const el=e.target.closest(".obj"); if(!el || tool!=="select")return;
 selected=el.dataset.id;const o=items.find(i=>i.id===selected);
 drag={o,p0:point(e),x:o.x,y:o.y,changed:false};el.setPointerCapture?.(e.pointerId);render();
});
$("#stage").addEventListener("pointermove",e=>{
 if(!drag)return;const p=point(e);
 if(Math.abs(p.x-drag.p0.x)+Math.abs(p.y-drag.p0.y)>0.1)drag.changed=true;
 drag.o.x=drag.x+p.x-drag.p0.x;drag.o.y=drag.y+p.y-drag.p0.y;render();
});
$("#stage").addEventListener("pointerup",()=>{
 if(drag?.changed){undoStack.push(JSON.stringify(items));redoStack=[]}
 drag=null;
});
function setTextColor(c){
 const o=items.find(i=>i.id===selected); if(!o)return;
 commitEdit(); $("#textColor").value=c; o.color=c; render();
}
function render(){
 const box=$("#objects");box.innerHTML="";
 items.forEach(o=>{
  const el=document.createElement("div");el.className="obj "+(o.id===selected?"selected":"");el.dataset.id=o.id;
  el.style.left=o.x+"%";el.style.top=o.y+"%";el.style.opacity=o.opacity;
  if(o.type==="text"){
   el.classList.add("text");el.textContent=o.text;el.style.color=o.color;el.style.fontSize=o.fontSize+"px";el.style.whiteSpace="pre-wrap";el.style.textAlign="center";
  }else{
   el.classList.add("marker");
   const d=document.createElement("div");d.className="dot "+o.kind;d.style.width=o.markerSize+"px";d.style.height=o.markerSize+"px";d.textContent="●";
   const c=document.createElement("div");c.className="caption";c.textContent=o.text;c.style.fontSize=o.fontSize+"px";
   el.append(d,c);
  }
  box.appendChild(el);
 });
 const o=items.find(i=>i.id===selected);
 $("#name").value=o?.text||"";$("#fontSize").value=o?.fontSize||16;$("#textColor").value=o?.color||"#ffffff";
 $("#markerSize").value=o?.markerSize||32;$("#opacity").value=(o?.opacity??1)*100;
 $("#status").textContent=(tool==="select"?"선택 도구":tool==="text"?"텍스트 추가":kindInfo[tool]?.name+" 표시 추가")+" · 항목 "+items.length+"개";
}
let editTimer=null;
function update(){
 const o=items.find(i=>i.id===selected);if(!o)return;
 o.text=$("#name").value;
 o.fontSize=Math.max(8,Math.min(72,+$("#fontSize").value||16));
 o.color=$("#textColor").value;
 o.markerSize=Math.max(14,Math.min(70,+$("#markerSize").value||32));
 o.opacity=Math.max(.1,Math.min(1,(+$(`#opacity`).value||100)/100));
 render();
}
function commitEdit(){
 const o=items.find(i=>i.id===selected);if(!o)return;
 clearTimeout(editTimer);
 undoStack.push(JSON.stringify(items.map(x=>({...x}))));
 if(undoStack.length>50)undoStack.shift();
 redoStack=[];
}
["name","fontSize","textColor","markerSize","opacity"].forEach(id=>{
 const el=$("#"+id);
 el.addEventListener("focus",()=>{ if(!editTimer) editTimer=setTimeout(()=>{},0); });
 el.addEventListener("change",()=>{commitEdit();update();});
 el.addEventListener("input",()=>{
   if(id==="name"||id==="fontSize"||id==="textColor"||id==="markerSize"||id==="opacity") update();
 });
});

$("#delete").onclick=()=>{if(!selected)return;const i=items.findIndex(x=>x.id===selected);snapshot();items.splice(i,1);selected=null;render()};
$("#undo").onclick=()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify(items));items=JSON.parse(undoStack.pop());selected=null;render()};
$("#redo").onclick=()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify(items));items=JSON.parse(redoStack.pop());selected=null;render()};
$("#front").onclick=()=>layer(1);$("#back").onclick=()=>layer(-1);
function layer(dir){const i=items.findIndex(x=>x.id===selected),j=i+dir;if(i<0||j<0||j>=items.length)return;snapshot();[items[i],items[j]]=[items[j],items[i]];render()}
function clearAll(){if(!confirm("텍스트와 표시를 모두 지울까요?"))return;snapshot();items=[];selected=null;render()}
function saveProject(){
 const a=document.createElement("a");a.download="전술맵-배치.json";a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,items},null,2)],{type:"application/json"}));a.click();
}
function loadProject(){
 const f=document.createElement("input");f.type="file";f.accept=".json";
 f.onchange=e=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);snapshot();items=d.items||[];selected=null;render()}catch{alert("전술맵 JSON 파일을 읽을 수 없습니다.")}};r.readAsText(e.target.files[0])};f.click();
}
$("#mapFile").onchange=e=>{const f=e.target.files[0];if(f)$("#map").src=URL.createObjectURL(f)}
$("#zoom").oninput=e=>{$("#stage").style.width=(1080*e.target.value/100)+"px"}

function exportImage(){
 const w=1080,h=827,c=document.createElement("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d"),img=new Image();
 img.onload=()=>{
  ctx.drawImage(img,0,0,w,h);
  items.forEach(o=>{
   const x=o.x*w/100,y=o.y*h/100;ctx.globalAlpha=o.opacity??1;
   if(o.type==="text"){ctx.fillStyle=o.color;ctx.font=`bold ${o.fontSize*2}px Arial`;ctx.textAlign="center";const lines=String(o.text).split(/\r?\n/);const lh=o.fontSize*2.2;lines.forEach((line,k)=>ctx.fillText(line,x,y+(k-(lines.length-1)/2)*lh))}
   else{const r=o.markerSize;const col=kindInfo[o.kind].color;ctx.beginPath();ctx.fillStyle=col;ctx.arc(x,y,r/2,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText("●",x,y+5);ctx.fillStyle=o.color;ctx.font=`${o.fontSize*2}px Arial`;ctx.fillText(o.text,x,y+r+25)}
  });ctx.globalAlpha=1;
  const a=document.createElement("a");a.download="전술맵.png";a.href=c.toDataURL("image/png");a.click();
 };
 img.src=$("#map").src;
}
render();
</script>
</body>
</html>
